<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Worldnews</title>
    <link rel="stylesheet" href="../css/style5.css">
    <link rel="stylesheet" href="../css/logo.css">
    <link rel="icon" href="../imagenes/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../imagenes/apple-touch-icon.png">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="Worldnews - News from around the world">
    <meta property="og:site_name" content="Worldnews">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sign In - Worldnews">
    <meta property="og:description" content="News from around the world">
    <meta property="og:image" content="https://proyecto-final-worldnews.netlify.app/imagenes/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://proyecto-final-worldnews.netlify.app/imagenes/og-image.png">
</head>
<body>
    <header><h1><a class="brand" href="index.html"><img class="brand-logo" src="../imagenes/logo.svg" alt="" width="52" height="52">Worldnews</a></h1></header>

    <div class="navigation-links">
        <a href="../pages/index.html">home</a>
        <a href="../pages/about us.html">about us</a> 
        <a href="../pages/donations.html">donations</a> 
        <a href="../pages/contact us.html">contact us</a> 
        <a href="../pages/log in.html">log in</a>
    </div>

    <form id="registerForm">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <input type="submit" value="Register">
    </form> 

    <footer>
        <h1>Angel Gabriel Rivera Resto was here</h1>
        <h2>All rights reserved to Worldnews &copy;</h2>   
    </footer>

    <script src="../dialogs.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    await wnAlert('¡Registro exitoso! Ahora puedes iniciar sesión.', { title: 'Cuenta creada' });
                    window.location.href = '../pages/log in.html';
                } else {
                    await wnAlert(data.error || 'Error al registrar el usuario', { title: 'No se pudo registrar', danger: true });
                }
            } catch (err) {
                console.error('Error:', err);
                await wnAlert('No se pudo conectar con el servidor backend.', { title: 'Error de conexión', danger: true });
            }
        });
    </script>
</body>
</html>
