<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style1.css"><!--este es el estilo de la pagina-->
    <link rel="stylesheet" href="../css/logo.css">
    <link rel="icon" href="../imagenes/favicon.png" type="image/png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../imagenes/apple-touch-icon.png">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="Worldnews - News from around the world">
    <meta property="og:site_name" content="Worldnews">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Worldnews">
    <meta property="og:description" content="News from around the world">
    <meta property="og:image" content="https://proyecto-final-worldnews.netlify.app/imagenes/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://proyecto-final-worldnews.netlify.app/imagenes/og-image.png">
</head>
<body>
    <header>
        <h1><a class="brand" href="index.html"><img class="brand-logo" src="../imagenes/logo.png" alt="" width="52" height="52">Worldnews</a></h1>
        <div class="header-links">
            <a href="../pages/about us.html">about us</a>
            <a href="../pages/subscriptions.html">donations</a>
            <a href="../pages/contact us.html">contact us</a>
            <a href="../pages/sign in.html">sign in</a>
            <a href="../pages/log in.html">log in</a>
            <!-- Botón de Account que abre el menú lateral -->
            <button class="account-btn" onclick="toggleSidebar()">Account 👤</button>
        </div>
    </header> 

    <!-- Menú Lateral (Sidebar Drawer) -->
    <div id="accountSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>My Account</h3>
            <span class="close-btn" onclick="toggleSidebar()">&times;</span>
        </div>
        <div class="sidebar-content">
            <!-- Enlaces protegidos con la función checkAuth -->
            <a href="#" onclick="checkAuth(event, '../pages/articles admin.html')" class="admin-link">Manage Articles 🛠️</a>
            <a href="../pages/profile settings.html">Profile Settings</a>
            <a href="../pages/Saved News.html">My Saved News</a>
            <hr>
            <!-- Enlace de cierre de sesión conectado a cerrarSesion() -->
            <a href="#" onclick="cerrarSesion(event)" style="color: #d9534f;">Log Out</a>
        </div>
    </div>
    
    <!-- Fondo oscuro para cerrar el menú al hacer clic afuera -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Search bar container placed right below the header links -->
    <div class="search-container">
        <input type="text" id="articleSearch" placeholder="Search articles..." onkeyup="searchArticles()">
        <button onclick="searchArticles()">Search</button>
    </div>

    <hr>

    <!-- Contenedor donde se cargarán automáticamente los artículos desde la base de datos -->
    <div id="articles-container">
        <p style="text-align: center; color: #888;">Cargando noticias...</p>
    </div>

    <hr>

    <footer><!--esto es el footer de la pagina-->
        <h1>Angel Gabriel Rivera Resto was here</h1>
        <h2>All rights reserved to Worldnews&#169</h2>  
    </footer>

    <script>
        // Función para la búsqueda de artículos
        function searchArticles() {
            const input = document.getElementById('articleSearch').value.toLowerCase().trim();
            const rows = document.getElementsByClassName('category-row');
            let anyVisible = false;

            for (const row of rows) {
                // Si la búsqueda coincide con el nombre de la categoría, se muestra la fila completa
                const categoryName = row.querySelector('.category-row-title').innerText.toLowerCase();
                const matchesCategory = input && categoryName.includes(input);
                let visibleInRow = 0;

                for (const article of row.getElementsByClassName('article-item')) {
                    const show = !input || matchesCategory || article.innerText.toLowerCase().includes(input);
                    article.style.display = show ? '' : 'none';
                    if (show) visibleInRow++;
                }

                row.style.display = visibleInRow ? '' : 'none';
                if (visibleInRow) {
                    anyVisible = true;
                    row.querySelector('.category-row-track').scrollLeft = 0;
                }
            }

            const noResults = document.getElementById('no-search-results');
            if (noResults) noResults.hidden = anyVisible || rows.length === 0;
            if (typeof updateAllRowArrows === 'function') updateAllRowArrows();
        }

        // Función para abrir y cerrar el panel lateral de Account
        function toggleSidebar() {
            const sidebar = document.getElementById('accountSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Función para verificar autenticación antes de entrar a páginas protegidas
        async function checkAuth(event, destinationUrl) {
            event.preventDefault();
            const usuarioLogueado = localStorage.getItem('usuarioActivo');

            if (!usuarioLogueado) {
                await wnAlert('Debes iniciar sesión para acceder a esta sección.', { title: 'Inicia sesión' });
                window.location.href = '../pages/log in.html';
            } else {
                window.location.href = destinationUrl;
            }
        }
    </script>

    <!-- Archivo JS que conecta con tu backend y pinta los artículos dinámicamente -->
    <script src="../dialogs.js"></script>
    <script src="../admin-nav.js"></script>
    <script src="../pins.js"></script>
    <script src="../main.js"></script>
</body>
</html>
