<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel="stylesheet" href="../css/style1.css"><!--este es el estilo de la pagina-->
</head>
<body>
    <header>
        <h1>Worldnews</h1>
        <div class="header-links">
            <a href="../pages/about us.html">about us</a>
            <a href="../pages/subscriptions.html">donations</a>
            <a href="../pages/contact us.html">contact us</a>
            <a href="../pages/sign in.html">sign in</a>
            <a href="../pages/log in.html">log in</a>
            <!-- Botón de Account que abre el menú lateral -->
            <button class="account-btn" onclick="toggleSidebar()">Account 👤</button>
        </div>
    </header> 

    <!-- Menú Lateral (Sidebar Drawer) -->
    <div id="accountSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>My Account</h3>
            <span class="close-btn" onclick="toggleSidebar()">&times;</span>
        </div>
        <div class="sidebar-content">
            <!-- Enlaces protegidos con la función checkAuth -->
            <a href="#" onclick="checkAuth(event, '../pages/articles admin.html')" class="admin-link">Manage Articles 🛠️</a>
            <a href="#">Profile Settings</a>
            <a href="#" onclick="checkAuth(event, '../pages/Saved News.html')">My Saved News</a>
            <hr>
            <!-- Enlace de cierre de sesión conectado a cerrarSesion() -->
            <a href="#" onclick="cerrarSesion(event)" style="color: #d9534f;">Log Out</a>
        </div>
    </div>
    
    <!-- Fondo oscuro para cerrar el menú al hacer clic afuera -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Search bar container placed right below the header links -->
    <div class="search-container">
        <input type="text" id="articleSearch" placeholder="Search articles..." onkeyup="searchArticles()">
        <button onclick="searchArticles()">Search</button>
    </div>

    <hr>

    <!-- Contenedor donde se cargarán automáticamente los artículos desde la base de datos -->
    <div id="articles-container">
        <p style="text-align: center; color: #888;">Cargando noticias...</p>
    </div>

    <hr>

    <footer><!--esto es el footer de la pagina-->
        <h1>Angel Gabriel Rivera Resto was here</h1>
        <h2>All rights reserved to Worldnews&#169</h2>  
    </footer>

    <script>
        // Función para la búsqueda de artículos
        function searchArticles() {
            let input = document.getElementById('articleSearch').value.toLowerCase();
            let articles = document.getElementsByClassName('article-item');
            
            for (let i = 0; i < articles.length; i++) {
                let text = articles[i].innerText.toLowerCase();
                if (text.includes(input)) {
                    articles[i].style.display = "";
                } else {
                    articles[i].style.display = "none";
                }
            }
        }

        // Función para abrir y cerrar el panel lateral de Account
        function toggleSidebar() {
            const sidebar = document.getElementById('accountSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Función para verificar autenticación antes de entrar a páginas protegidas
        async function checkAuth(event, destinationUrl) {
            event.preventDefault();
            const usuarioLogueado = localStorage.getItem('usuarioActivo');

            if (!usuarioLogueado) {
                await wnAlert('Debes iniciar sesión para acceder a esta sección.', { title: 'Inicia sesión' });
                window.location.href = '../pages/log in.html';
            } else {
                window.location.href = destinationUrl;
            }
        }
    </script>

    <!-- Archivo JS que conecta con tu backend y pinta los artículos dinámicamente -->
    <script src="../dialogs.js"></script>
    <script src="../pins.js"></script>
    <script src="../main.js"></script>
</body>
</html>
