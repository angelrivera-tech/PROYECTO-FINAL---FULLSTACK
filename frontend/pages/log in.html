<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Worldnews</title>
    <link rel="stylesheet" href="../css/style5.css">
</head>
<body>
    <header><h1>Worldnews</h1></header>

    <div class="navigation-links">
        <a href="../pages/index.html">home</a>
        <a href="../pages/about us.html">about us</a> 
        <a href="../pages/subscriptions.html">donations</a> 
        <a href="../pages/contact us.html">contact us</a> 
        <a href="../pages/sign in.html">sign in</a>
    </div>

    <form id="loginForm">
        <!-- Paso 1: Credenciales -->
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br>

        <!-- Botón del Paso 1 -->
        <button type="button" id="sendCodeBtn">Enviar Código 2FA</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <!-- Paso 2: Código 2FA -->
        <label for="verificationCode">Código 2FA (6 dígitos):</label><br>
        <input type="text" id="verificationCode" name="verificationCode" maxlength="6" placeholder="123456" autocomplete="off">
        <p class="hint-text">Ingresa aquí el código de 6 dígitos que enviamos a tu correo.</p>

        <!-- Botón del Paso 2 -->
        <button type="button" id="verifyBtn">Verificar Código y Entrar</button>
    </form> 

    <footer>
        <h1>Angel Gabriel Rivera Resto was here</h1>
        <h2>All rights reserved to Worldnews &copy;</h2>   
    </footer>

    <script>
        let temporaryUserId = null;

        // BOTÓN 1: Enviar usuario y contraseña para recibir el código por correo
        document.getElementById('sendCodeBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Por favor ingresa tu usuario y contraseña primero.');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok && data.requires2FA) {
                    temporaryUserId = data.userId;
                    alert(data.message);
                } else {
                    alert(data.error || 'Usuario o contraseña incorrectos');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('No se pudo conectar con el servidor backend.');
            }
        });

        // BOTÓN 2: Enviar el código de 6 dígitos para finalizar el acceso
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const code = document.getElementById('verificationCode').value;

            if (!temporaryUserId) {
                alert('Primero debes solicitar el código haciendo clic en "Enviar Código 2FA".');
                return;
            }

            if (!code || code.length !== 6) {
                alert('Por favor introduce un código válido de 6 dígitos.');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: temporaryUserId, code: code })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    // Guardar la sesión en el navegador para que el panel de administración y el menú la reconozcan
                    localStorage.setItem('usuarioActivo', data.username);

                    alert('¡Login exitoso! Bienvenido, ' + data.username);
                    window.location.href = '../pages/index.html'; 
                } else {
                    alert(data.error || 'Código incorrecto o expirado');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('Error al verificar el código con el servidor.');
            }
        });
    </script>
</body>
</html>
