<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Worldnews</title>
    <link rel="stylesheet" href="../css/style5.css">
    <link rel="stylesheet" href="../css/logo.css">
    <link rel="icon" href="../imagenes/favicon.png" type="image/png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../imagenes/apple-touch-icon.png">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="Worldnews - News from around the world">
    <meta property="og:site_name" content="Worldnews">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Log In - Worldnews">
    <meta property="og:description" content="News from around the world">
    <meta property="og:image" content="https://proyecto-final-worldnews.netlify.app/imagenes/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://proyecto-final-worldnews.netlify.app/imagenes/og-image.png">
</head>
<body>
    <header><h1><a class="brand" href="index.html"><img class="brand-logo" src="../imagenes/logo.png" alt="" width="52" height="52">Worldnews</a></h1></header>

    <div class="navigation-links">
        <a href="../pages/index.html">home</a>
        <a href="../pages/about us.html">about us</a> 
        <a href="../pages/subscriptions.html">donations</a> 
        <a href="../pages/contact us.html">contact us</a> 
        <a href="../pages/sign in.html">sign in</a>
    </div>

    <form id="loginForm">
        <!-- Paso 1: Credenciales -->
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br>
        <p class="forgot-link"><a href="../pages/account recovery.html">¿Olvidaste tu contraseña o usuario?</a></p>

        <!-- Botón del Paso 1 -->
        <button type="button" id="sendCodeBtn">Enviar Código 2FA</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <!-- Paso 2: Código 2FA -->
        <label for="verificationCode">Código 2FA (6 dígitos):</label><br>
        <input type="text" id="verificationCode" name="verificationCode" maxlength="6" placeholder="123456" autocomplete="off">
        <p class="hint-text">Ingresa aquí el código de 6 dígitos que enviamos a tu correo.</p>

        <!-- Botón del Paso 2 -->
        <button type="button" id="verifyBtn">Verificar Código y Entrar</button>
    </form> 

    <footer>
        <h1>Angel Gabriel Rivera Resto was here</h1>
        <h2>All rights reserved to Worldnews &copy;</h2>   
    </footer>

    <script src="../dialogs.js"></script>
    <script>
        let temporaryUserId = null;

        // BOTÓN 1: Enviar usuario y contraseña para recibir el código por correo
        document.getElementById('sendCodeBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                await wnAlert('Por favor ingresa tu usuario y contraseña primero.', { title: 'Faltan datos' });
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok && data.requires2FA) {
                    temporaryUserId = data.userId;
                    await wnAlert(data.message, { title: 'Código enviado' });
                } else {
                    await wnAlert(data.error || 'Usuario o contraseña incorrectos', { title: 'No se pudo iniciar sesión', danger: true });
                }
            } catch (err) {
                console.error('Error:', err);
                await wnAlert('No se pudo conectar con el servidor backend.', { title: 'Error de conexión', danger: true });
            }
        });

        // BOTÓN 2: Enviar el código de 6 dígitos para finalizar el acceso
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const code = document.getElementById('verificationCode').value;

            if (!temporaryUserId) {
                await wnAlert('Primero debes solicitar el código haciendo clic en "Enviar Código 2FA".', { title: 'Falta el código' });
                return;
            }

            if (!code || code.length !== 6) {
                await wnAlert('Por favor introduce un código válido de 6 dígitos.', { title: 'Código inválido' });
                return;
            }

            try {
                const response = await fetch('/api/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: temporaryUserId, code: code })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    // Guardar la sesión en el navegador para que el panel de administración y el menú la reconozcan
                    localStorage.setItem('usuarioActivo', data.username);
                    localStorage.setItem('usuarioId', data.userId);
                    if (data.sessionToken) localStorage.setItem('wnSessionToken', data.sessionToken);
                    if (data.isAdmin) localStorage.setItem('wnIsAdmin', '1');
                    else localStorage.removeItem('wnIsAdmin');

                    await wnAlert('¡Login exitoso! Bienvenido, ' + data.username, { title: 'Bienvenido' });
                    window.location.href = '../pages/index.html'; 
                } else {
                    await wnAlert(data.error || 'Código incorrecto o expirado', { title: 'Código incorrecto', danger: true });
                }
            } catch (err) {
                console.error('Error:', err);
                await wnAlert('Error al verificar el código con el servidor.', { title: 'Error de conexión', danger: true });
            }
        });
    </script>
</body>
</html>
