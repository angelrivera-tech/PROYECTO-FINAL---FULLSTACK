<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DONATIONS</title>
    <!-- Linked to style3.css -->
    <link rel="stylesheet" href="../css/style3.css">
</head>
<body>
    <header>
        <h1>DONATIONS</h1>
        <div class="header-links">
            <a href="../pages/index.html">home</a>
            <a href="../pages/about us.html">about us</a>
            <a href="../pages/contact us.html">contact us</a>
            <a href="../pages/sign in.html">sign in</a>
            <a href="../pages/log in.html">log in</a>
            <!-- Account button triggers sidebar -->
            <button class="account-btn" onclick="toggleSidebar()">Account 👤</button>
        </div>
    </header> 

    <!-- Account Sidebar Drawer -->
    <div id="accountSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>My Account</h3>
            <span class="close-btn" onclick="toggleSidebar()">&times;</span>
        </div>
        <div class="sidebar-content">
            <a href="../pages/articles admin.html" class="admin-link">Manage Articles 🛠️</a>
            <a href="../pages/profile settings.html">Profile Settings</a>
            <a href="../pages/Saved News.html">My Saved News</a>
            <hr>
            <a href="../pages/log in.html" style="color: #d9534f;">Log Out</a>
        </div>
    </div>
    
    <!-- Dark backdrop overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Search container positioned directly under header links -->
    <div class="search-container">
        <input type="text" id="donationSearch" placeholder="Search donations..." onkeyup="searchDonations()">
        <button onclick="searchDonations()">Search</button>
    </div>

    <hr>
    
    <!-- Donations Content Grid -->
    <div class="subscription-container" id="donations-container">
        <div class="subscription-box donation-item"> 
            <p>Donation Tier 1</p>
            <img src="../imagenes/Capture.PNG" alt="Donation Tier 1">
        </div>

        <div class="subscription-box donation-item"> 
            <p>Donation Tier 2</p>
            <img src="../imagenes/Capture.PNG" alt="Donation Tier 2">
        </div>

        <div class="subscription-box donation-item"> 
            <p>Donation Tier 3</p>
            <img src="../imagenes/Capture.PNG" alt="Donation Tier 3">
        </div>
    </div>
         
    <hr>

    <!-- Custom Inline Modal Popup -->
    <div id="customModal" class="modal-backdrop">
        <div class="modal-box">
            <h3 id="modalTitle">Notice</h3>
            <p id="modalMessage">Your message goes here.</p>
            <div class="modal-actions">
                <button id="modalConfirmBtn" class="modal-btn-confirm">Confirm</button>
                <button id="modalCloseBtn" class="modal-btn-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <footer>
        <h1>Angel Gabriel Rivera Resto was here</h1>
        <h2>All rights reserved to Worldnews &copy;</h2> 
    </footer>

    <script>
        // Search function for donation items
        function searchDonations() {
            let input = document.getElementById('donationSearch').value.toLowerCase();
            let items = document.getElementsByClassName('donation-item');
            
            for (let i = 0; i < items.length; i++) {
                let text = items[i].innerText.toLowerCase();
                if (text.includes(input)) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }

        // Toggle Account sidebar menu
        function toggleSidebar() {
            const sidebar = document.getElementById('accountSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
    </script>
    <!-- Linked to your simulation JavaScript file -->
    <script src="../donations.js" defer></script>
</body>
</html>
