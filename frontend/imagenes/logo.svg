<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Worldnews logo">
  <title>Worldnews</title>
  <defs>
    <radialGradient id="wn-globe" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="0.55" stop-color="#1f6fd6"/>
      <stop offset="1" stop-color="#0a2f6b"/>
    </radialGradient>
    <clipPath id="wn-clip"><circle cx="32" cy="32" r="21"/></clipPath>
  </defs>
  <!-- back half of the orbit ring (behind the globe) -->
  <g transform="rotate(-25 32 32)">
    <path d="M3 32 A29 9.5 0 0 1 61 32" fill="none" stroke="#e63946" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- globe -->
  <circle cx="32" cy="32" r="21" fill="url(#wn-globe)"/>
  <g clip-path="url(#wn-clip)" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5">
    <ellipse cx="32" cy="32" rx="9" ry="21"/>
    <ellipse cx="32" cy="32" rx="17" ry="21"/>
    <line x1="32" y1="11" x2="32" y2="53"/>
    <line x1="11" y1="32" x2="53" y2="32"/>
    <path d="M13 21.5 Q32 26 51 21.5"/>
    <path d="M13 42.5 Q32 38 51 42.5"/>
  </g>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.6"/>
  <!-- front half of the orbit ring with a "live news" dot -->
  <g transform="rotate(-25 32 32)">
    <path d="M3 32 A29 9.5 0 0 0 61 32" fill="none" stroke="#e63946" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="61" cy="32" r="4.2" fill="#ff4d5a" stroke="#ffffff" stroke-width="1.4"/>
  </g>
</svg>
